name: vpasound.com
version: '3.8'
services:
  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:7.17.10'
    container_name: elasticsearch-vpasound
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - '9200:9200'
    deploy:
      resources:
        limits:
          memory: 512M
          
  kafka:
    image: 'apache/kafka:latest'
    container_name: ecom-kafka
    hostname: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      
  kafka-ui:
    image: 'provectuslabs/kafka-ui:latest'
    container_name: kafka-ui
    ports:
      - '8089:8080'
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: vpasound-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
      
  mysql:
    image: 'mysql:latest'
    container_name: mysql-server
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: 07021991@Vinh
    volumes:
      - mysql_vpa_data:/var/lib/mysql
      
  redis:
    image: redis:alpine
    container_name: redis-vpa
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-vpa
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
      - "15674:15674"
    command: >
      sh -c "echo '[rabbitmq_management, rabbitmq_prometheus, rabbitmq_stomp, rabbitmq_web_stomp].' > /etc/rabbitmq/enabled_plugins && exec rabbitmq-server"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: ecom-redisinsight
    ports:
        - "5540:5540"
    volumes:
        - redisinsight_data:/data
    depends_on:
        - redis
volumes:
    redisinsight_data: 
    mysql_vpa_data:
        
        
        
        
        