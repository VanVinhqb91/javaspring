
# ===================== HOST NAME WEBSITE ======================
spring.application.name=vpasound
server.port = 80
server.address=127.0.0.1
server.servlet.context-path=/

# ===================== CONNECT MYSQL SERVER ===================
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/vpa_sound?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username = root
spring.datasource.password=
spring.datasource.hikari.jdbc-url=${spring.datasource.url}

# ===================== MYSQL ==================================
logging.level.org.hibernate = warn
logging.level.org.hibernate.SQL = DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder = TRACE

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

# ==================== UPLOAD FILES ============================
# Kich thuoc toi da cho 1 file
spring.servlet.multipart.max-file-size = 5MB
# Tong kich thuoc toi da cho mot Request, neu upload nhieu file cung 1 luc
spring.servlet.multipart.max-request-size = 5MB 

# ==================== URL UPLOAD IMAGES =======================
upload.path_products = src/main/resources/static/images/products/
upload.path_users = src/main/resources/static/images/users/
upload.path_brands = src/main/resources/static/images/brands/

# Tat cache thymeleaf
spring.thymeleaf.cache=false

# =================== ELASTIC SEARCH ===========================
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

# =================== SEND EMAIL SMTP ==========================
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=aa9f742609fe96
spring.mail.password=f9c5871c6b6cb8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==================== RABBIT MQ ===============================
spring.rabbitmq.virtual-host=/
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Ten queue va exchange chung ta tu dinh nghia
app.rabbitmq.exchange=user.exchange
app.rabbitmq.queue=user.registration.email.queue
app.rabbitmq.routing-key=user.registration.routing
spring.reactor.netty.pool.leak-detection=disabled

