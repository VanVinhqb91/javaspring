
# ===================== HOST NAME WEBSITE ======================
spring.application.name=vpasound
server.port=80
server.address=127.0.0.1
#server.address=0.0.0.0
server.servlet.context-path=/

#file log cua he thong
logging.file.path=./logs/system/
# Tự động đổi tên và tạo file mới khi file hiện tại đạt 10MB
logging.logback.rollingpolicy.max-file-size=10MB
# Chỉ giữ lại log của 7 ngày gần nhất (các ngày cũ hơn tự xóa)
logging.logback.rollingpolicy.max-history=7

# ===================== CONNECT MYSQL SERVER ===================
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/vpasound?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username = root
spring.datasource.password= 07021991@Vinh
spring.datasource.hikari.jdbc-url=${spring.datasource.url}

# ===================== MYSQL ==================================
logging.level.org.hibernate = warn
logging.level.org.hibernate.SQL = DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder = TRACE

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

# ==================== UPLOAD FILES ============================
# Kich thuoc toi da cho 1 file
spring.servlet.multipart.max-file-size = 5MB
# Tong kich thuoc toi da cho mot Request, neu upload nhieu file cung 1 luc
spring.servlet.multipart.max-request-size = 5MB 

# ==================== URL UPLOAD IMAGES =======================
upload.path_products = src/main/resources/static/images/products/
upload.path_users = src/main/resources/static/images/users/
upload.path_brands = src/main/resources/static/images/brands/

# Tat cache thymeleaf
spring.thymeleaf.cache=false

# =================== ELASTIC SEARCH ===========================
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

