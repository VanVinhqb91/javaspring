#===================== KAFKA ====================================
# --- ĐỊA CHỈ KẾT NỐI BROKER CÔNG KHAI ---
spring.kafka.bootstrap-servers=localhost:9092

# --- KHÓA TUYỆT ĐỐI HÀNH VI TỰ ĐỘNG SẬP MÁY CỦA TOMCAT ---
spring.lifecycle.timeout-per-shutdown-phase=0s
server.shutdown=immediate

# --- CẤU HÌNH CONSUMER PHẲNG CHỐNG NGHẼN BỘ LỌC JAVA ---
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.component.arguments=--Djava.net.preferIPv4Stack=true
# Số lượng tin nhắn tối đa gom vào 1 lô
spring.kafka.consumer.max-poll-records=2
spring.jpa.properties.hibernate.jdbc.batch_size=2
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=true
# Ép hệ thống Consumer tự động thử lại sau mỗi 5 giây nếu Broker bận, quyết không sập máy
#spring.kafka.consumer.properties.retry.backoff.ms=5000

logging.level.org.springframework.kafka=OFF
logging.level.org.apache.kafka=OFF

