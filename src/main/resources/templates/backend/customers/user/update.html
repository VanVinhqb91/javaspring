<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{backend/fragments/head :: htmlHeadUser}"></head>
<body class="text-slate-700 antialiased min-h-screen flex flex-col">
	<div class="flex flex-1">
		<div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
		
		<main class="ml-24 flex-1 bg-[#f5f5f5] p-6 overflow-x-auto">
			<div th:replace="~{backend/fragments/header :: htmlHeader}"></div>

			<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
				<div>
					<h1 class="text-2xl font-light text-slate-800">
						<b>Customers / User / Update</b>
					</h1>
				</div>
				<div class="action-buttons">
					<button class="btn-secondary"><a th:href="@{/backend/customers/user}">Back</a></button>
					<button type="submit" form="update_user" class="btn-primary">Update User</button>
				</div>
			</div>
			
			<form id="update_user" th:action="@{/backend/customers/user/update/{id}(id=${id})}" th:object="${updateUser}" method="POST" class="admin-content">
				<div id="user-info" class="tab-pane active">
					<h2 class="fieldset-title">Account Information</h2>

					<div class="form-group required">
						<label for="username">User Name</label>
						<div class="form-control-wrapper">
							<input type="text" th:field="*{username}" class="form-control"/>
						</div>
					</div>

					<div class="form-group required">
						<label for="password">Password</label>
						<div class="form-control-wrapper">
							<input type="password" th:field="*{password}" class="form-control">
							<div class="password-meter">
								<div id="meter-bar" class="password-meter-fill"></div>
							</div>
							<span class="field-note">Password must be at least 7
								characters long and include letters and numbers.</span>
						</div>
					</div>

					<div class="form-group required">
						<label for="password-conf">Password Confirmation</label>
						<div class="form-control-wrapper">
							<input type="password" id="password-conf" class="form-control">
						</div>
					</div>

					<div class="form-group">
						<label for="dob">Birthday: </label>
						<input type="date" th:field="*{birthday}" id="dob" name="dob">
					</div>

					<div class="form-group required">
						<label for="interface-locale">Interface Locale</label>
						<div class="form-control-wrapper">
							<select id="interface-locale" th:field="*{locale}" class="form-control" size="3">
								<option value="vi_VN" selected>Vietnamese (Vietnam)</option>
								<option value="en_US">English (United States)</option>
								<option value="fr_FR">French (France)</option>
							</select>
						</div>
					</div>

					<div class="form-group required active">
						<label for="user-role-select active">Status</label>
						<div class="form-control-wrapper">
							<label class="switch"> 
							<select id="interface-locale" th:field="*{status}" class="form-control" size="2">
								<option value="1" selected>Activated</option>
								<option value="0">Not Activated</option>
							</select>
						</div>
					</div>

					<div class="form-group required active">
						<label for="user-role-select active">Assigned Role</label>
						<div class="form-control-wrapper">
							<select th:field="*{user_role}" id="user-role-select" class="form-control" size="4">
								<option value="1">Administrators</option>
								<option value="2">Store Manager</option>
								<option value="3">Sales / Orders Manager</option>
								<option value="4">Customer Support</option>
							</select> <span class="field-note">Select a role to grant specific
								access permissions to this user.</span>
						</div>
					</div>
					<!--
					<h2 class="fieldset-title" style="margin-top: 30px;">Current
						User Identity Verification</h2>

					<div class="form-group required">
						<label for="current-password">Your Password</label>
						<div class="form-control-wrapper">
							<input type="password" id="current-password"
								class="form-control"> <span class="field-note">Enter
								your current logged-in password to confirm user creation.</span>
						</div>
					</div>
					-->
				</div>

				<!-- <div id="user-role" class="tab-pane">
					<h2 class="fieldset-title">User Role Assignment</h2>

					<div class="form-group required active">
						<label for="user-role-select active">Assigned Role</label>
						<div class="form-control-wrapper">
							<select id="user-role-select" class="form-control" size="5">
								<option value="1">Administrators</option>
								<option value="2">Store Manager</option>
								<option value="3">Sales / Orders Manager</option>
								<option value="4">Customer Support</option>
							</select> <span class="field-note">Select a role to grant specific
								access permissions to this user.</span>
						</div>
					</div>
				</div> -->
			</form>
		</main>
	</div>
</body>
</html>
