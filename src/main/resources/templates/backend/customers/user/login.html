<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #413c38;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i style="color: #eb5202" class="fas fa-user-circle fa-3x mb-3"></i>
                            <h3 class="fw-bold">Login Admin</h3>
                        </div>

                        <!-- Form đăng nhập -->
                        <form id="loginForm">
                            <!-- Email / Tên đăng nhập -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="text" class="form-control" id="email" placeholder="Enter email" required>
                                </div>
                                <div class="invalid-feedback" id="usernameError">Please enter your email</div>
                            </div>
                            <!-- Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                                </div>
                                <div class="invalid-feedback" id="passwordError">Please enter password</div>
                            </div>

                            <!-- Nút Submit -->
                            <button type="submit" style="background-color: #eb5202; border-radius: 0px; color: white; font-weight: bold;" class="btn w-100 py-2 mb-3">Login</button>

                            <!-- Thông báo trạng thái đăng nhập -->
                            <div id="alertMessage" class="alert d-none text-center" role="alert"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/javascript">
        $(document).ready(function() {
            $('#loginForm').on('submit', function(e) {
                e.preventDefault(); // Ngăn chặn form submit mặc định

                var email = $('#email').val().trim();
                var password = $('#password').val().trim();
                var isValid = true;
                if (email === '') {
                    $('#email').addClass('is-invalid');
                    isValid = false;
                } 
                else {
                    $('#email').removeClass('is-invalid').addClass('is-valid');
                }

                if (password === '') {
                    $('#password').addClass('is-invalid');
                    isValid = false;
                } 
                else {
                    $('#password').removeClass('is-invalid').addClass('is-valid');
                }
                if (isValid) {
                    var submitBtn = $(this).find('button[type="submit"]');
                    submitBtn.prop('disabled', true).text('Đang xử lý...');
                    submitBtn.prop('disabled', false).text('Đăng Nhập');

                    $.ajax({
                        url: '/backend/login/ajax',
                        type: 'POST',
                        dataType: 'json',
                        data: {email: email, password: password},
                        success: function(response) {
                        	if (response.status == true) {
                        		$('#alertMessage')
                                .removeClass('d-none alert-danger')
                                .addClass('alert-success')
                                .text('Đăng nhập thành công! Đang chuyển hướng...');
	                            setTimeout(function() {
	                                window.location.href = response.data;
	                            }, 1000);
                            
                        	} else {
                        		$('#alertMessage')
                                .removeClass('d-none alert-success')
                                .addClass('alert-danger')
                                .text('Tài khoản hoặc mật khẩu không chính xác!');
                        	}
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
