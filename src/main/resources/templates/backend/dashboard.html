<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{backend/fragments/head :: htmlHead}"></head>
    
	<body class="text-slate-700 antialiased min-h-screen flex flex-col">
		
		<div class="flex flex-1">
			<div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
			<!-- Main Content Area -->
			<main class="ml-24 flex-1 bg-[#f5f5f5] p-6 overflow-x-auto">
				<div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
				<div class="page-title">
                	<h1 style="font-weight: bold;">Dashboard</h1>
            	</div>

                <div class="container mx-auto mt-12 px-4">
                    <h2 class="mb-8 text-center text-2xl font-bold text-black-600">Lưu Lượng Truy Cập Website</h2>
                    
                    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
                        <!-- Thống kê Ngày -->
                        <div class="transform rounded-lg bg-white p-6 text-center shadow-sm transition duration-200 hover:scale-105">
                            <h6 class="text-xs font-semibold uppercase tracking-wider text-gray-400">Hôm Nay</h6>
                            <h2 class="mt-2 text-3xl font-extrabold text-green-600" th:text="${#numbers.formatInteger(todayCount, 1, 'DEFAULT')} + ''">0</h2>
                        </div>

                        <!-- Thống kê Tuần -->
                        <div class="transform rounded-lg bg-white p-6 text-center shadow-sm transition duration-200 hover:scale-105">
                            <h6 class="text-xs font-semibold uppercase tracking-wider text-gray-400">Tuần Này</h6>
                            <h2 class="mt-2 text-3xl font-extrabold text-cyan-600" th:text="${#numbers.formatInteger(weekCount, 1, 'DEFAULT')} + ''">0</h2>
                        </div>

                        <!-- Thống kê Tháng -->
                        <div class="transform rounded-lg bg-white p-6 text-center shadow-sm transition duration-200 hover:scale-105">
                            <h6 class="text-xs font-semibold uppercase tracking-wider text-gray-400">Tháng Này</h6>
                            <h2 class="mt-2 text-3xl font-extrabold text-amber-500" th:text="${#numbers.formatInteger(monthCount, 1, 'DEFAULT')} + ''">0</h2>
                        </div>

                        <!-- Thống kê Năm -->
                        <div class="transform rounded-lg bg-white p-6 text-center shadow-sm transition duration-200 hover:scale-105">
                            <h6 class="text-xs font-semibold uppercase tracking-wider text-gray-400">Năm Nay</h6>
                            <h2 class="mt-2 text-3xl font-extrabold text-red-600" th:text="${#numbers.formatInteger(yearCount, 1, 'DEFAULT')} + ''">0</h2>
                        </div>
                    </div>
                </div>

                
	            <!-- Metric Cards -->
	            <div class="metrics-grid">
	                <div class="card stat-card">
	                    <h3>Revenue</h3>
	                    <div class="amount">$0.00</div>
	                </div>
	                <div class="card stat-card">
	                    <h3>Tax</h3>
	                    <div class="amount">$0.00</div>
	                </div>
	                <div class="card stat-card">
	                    <h3>Shipping</h3>
	                    <div class="amount">$0.00</div>
	                </div>
	                <div class="card stat-card">
	                    <h3>Quantity</h3>
	                    <div class="amount">0</div>
	                </div>
	            </div>

	            <!-- Dashboard Tabs / Tables -->
	            <div class="dashboard-tabs">
	                <div class="tab-header">
	                    <button class="tab-btn active">Last Orders</button>
	                    <button class="tab-btn">Search Terms</button>
	                    <button class="tab-btn">Most Viewed Products</button>
	                    <button class="tab-btn">New Customers</button>
	                </div>
	                <div class="tab-content">
	                    <table>
	                        <thead>
	                            <tr>
	                                <th>Customer</th>
	                                <th>Items</th>
	                                <th>Total</th>
	                            </tr>
	                        </thead>
	                        <tbody>
	                            <tr>
	                                <td colspan="3" class="empty-row">We couldn't find any records.</td>
	                            </tr>
	                        </tbody>
	                    </table>
	                </div>
	            </div>
			</main>
		</div>
	</body>
</html>
