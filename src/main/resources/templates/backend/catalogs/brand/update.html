<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{backend/fragments/head :: htmlHeadProduct}"></head>

<body class="text-slate-700 antialiased min-h-screen flex flex-col pb-0 pr-0">
    <div class="flex flex-1">
        <div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
        <main class="ml-[75px] flex-1 bg-[#f5f5f5] overflow-x-auto">
            <div class="p-6">
                <div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-light text-slate-800">
                            <b>Catalogs / Brand / Update</b>
                        </h1>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-secondary">
                            <a th:href="@{${urlSecretKey.url('/backend/catalogs/brand')}}">Back</a>
                        </button>
                        <button type="submit" form="update_brand" name="action" value="save"
                            class="btn-secondary">Save</button>
                        <button type="submit" form="update_brand" name="action" value="saveAndClose"
                            class="btn-primary">Save & Closed</button>
                    </div>
                </div>

                <form id="update_brand" th:action="@{${urlSecretKey.url('/backend/catalogs/brand/update/' + id)}}"
                    th:object="${createBrandForm}" enctype="multipart/form-data" method="POST"
                    class="bg-white border-slate-300 rounded-t shadow-sm">
                    <main class="main-content">
                        <section class="panel">
                            <div class="panel-header" onclick="togglePanel(this)">Basic
                                Settings</div>
                            <div class="panel-body">
                                <div class="form-group required">
                                    <label>Enable Brand</label>
                                    <div class="switch-container">
                                        <label class="switch" style="width: 140px"> <input type="checkbox" name="status"
                                                value="1" th:checked="*{status} == 1"> <span class="slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="form-group required">
                                    <label for="product-name">Brand Name</label> <input type="text" th:field="*{name}"
                                        class="form-control" placeholder="e.g. Fusion Backpack" required>
                                </div>

                                <div class="form-group">
                                    <label for="qty">Slug</label> <input type="text" th:field="*{slug}"
                                        class="form-control" value="100">
                                </div>

                                <div class="form-group" style="display: block;">
                                    <label for="desc">Description</label><br>
                                    <textarea id="editorDescription" th:field="*{description}" class="form-control"
                                        style="min-height: 140px;"></textarea>
                                </div>
                            </div>
                        </section>

                        <!-- Images & Videos Panel -->
                        <section class="panel">
                            <div class="panel-header" onclick="togglePanel(this)">Logo Brand</div>
                            <div class="panel-body">
                                <div class="upload-zone">
                                    <input type="file" name="image-file">
                                    <p>
                                        <strong>Browse files</strong> or drag & drop images here
                                    </p>
                                    <span class="field-note">Supports JPG, PNG, GIF files.</span>
                                </div>
                            </div>
                        </section>
                    </main>
                </form>
                <div class="w-[100%] pb-[60px]">
                    <div class="action-buttons float-right">
                        <button class="btn-secondary">
                            <a th:href="@{${urlSecretKey.url('/backend/catalogs/brand')}}">Back</a>
                        </button>
                        <button type="submit" form="update_brand" name="action" value="save"
                            class="btn-secondary">Save</button>
                        <button type="submit" form="update_brand" name="action" value="saveAndClose"
                            class="btn-primary">Save & Closed</button>
                    </div>
                </div>
            </div>
            <div th:replace="~{backend/fragments/footer :: htmlFooter}"></div>
        </main>
    </div>

    <script type="text/javascript">
        function togglePanel(header) {
            const panel = header.parentElement;
            panel.classList.toggle('collapsed');
        };

        ClassicEditor
            .create(document.querySelector('#editorDescription'))
            .then(editor => {
                editor.editing.view.change(writer => {
                    writer.setStyle('height', '300px', editor.editing.view.document.getRoot());
                });
            });
    </script>
</body>
</html>
