<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{backend/fragments/head :: htmlHeadProduct}"></head>
<body class="text-slate-700 antialiased min-h-screen flex flex-col">
	
	<div class="flex flex-1">
		<div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>

		<main class="ml-24 flex-1 bg-[#f5f5f5] p-6 overflow-x-auto">
			<div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
			<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
				<div>
					<h1 class="text-2xl font-light text-slate-800">
						<b>Catalogs / Product / Create</b>
					</h1>
				</div>
				<div class="action-buttons">
					<button class="btn-secondary">
						<a th:href="@{/backend/catalogs/product}">Back</a>
					</button>
					<button type="submit" form="add_product" name="action" value="save" class="btn-secondary">Save</button>
					<button type="submit" form="add_product" name="action" value="saveAndClose" class="btn-primary">Save & Closed</button>
				</div>
			</div>
			
			<form id="add_product" th:action="@{/backend/catalogs/product/create}"
				th:object="${createProduct}" enctype="multipart/form-data" method="POST"
				class="bg-white border border-slate-300 rounded-t shadow-sm">
				<main class="main-content">
					<section class="panel">
						<div class="panel-header" onclick="togglePanel(this)">Basic
							Settings</div>
						<div class="panel-body">
							<div class="form-group required">
								<label>Enable Product</label>
								<div class="switch-container">
									<label class="switch" style="width: 140px"> <input
										type="checkbox" name="status" value="1"
										th:checked="*{status} == 1"> <span class="slider"></span>
									</label>
								</div>
							</div>
							<div class="form-group required">
								<label for="product-name">Product Name</label> <input
									type="text" th:field="*{name}" class="form-control"
									placeholder="e.g. Fusion Backpack" required>
							</div>

							<div class="form-group required">
								<label for="sku">SKU</label> <input type="text"
									th:field="*{sku}" class="form-control" placeholder="24-MB01" required>
							</div>

							<div class="form-group required">
								<label for="price">Price ($)</label> <input type="number"
									step="0.01" th:field="*{price}" class="form-control"
									placeholder="14500000" required>
							</div>

							<div class="form-group">
								<label for="tax-class">Tax Class</label> <select id="tax-class"
									class="form-control">
									<option value="none">None</option>
									<option value="taxable" selected>Taxable Goods</option>
									<option value="shipping">Shipping</option>
								</select>
							</div>

							<div class="form-group required">
								<label for="qty">Quantity</label> <input type="number"
									th:field="*{qty}" class="form-control" value="100" required>
							</div>
							
							<div class="form-group">
								<label for="qty">Quantity Sold</label> <input type="number"
									th:field="*{qtySold}" class="form-control" value="1">
							</div>

							<div class="form-group required">
								<label for="stock-status">Stock Status</label> <select
									th:field="*{stockStatus}" class="form-control" required>
									<option value="1">In Stock</option>
									<option value="0">Out of Stock</option>
								</select>
							</div>
							
							<div class="form-group required">
								<label for="categories">Categories</label> 
								<select th:field="*{categoryId}" class="form-control" multiple style="height: 180px;" required>
									<option th:each="cate:${flatCate}" th:value="${cate.id}" th:text="${cate.name}"></option>
								</select>
							</div>
							
							<div class="form-group required">
								<label for="categories">Brands</label> 
								<select th:field="*{brandId}" class="form-control" multiple style="height: 180px;" required>
									<option th:each="brand:${brands}" th:value="${brand.id}">--- [[${brand.name}]] ([[${brand.slug}]])</option>
								</select>
							</div>
						</div>
					</section>

					<!-- Content Panel -->
					<section class="panel">
						<div class="panel-header" onclick="togglePanel(this)">Content</div>
						<div class="panel-body">
							<div class="form-group">
								<label for="short-desc">Short Description</label>
								<textarea id="editorShort" th:field="*{shortDescription}" class="form-control"></textarea>
							</div>
							<div class="form-group" style="display: block;">
								<label for="desc">Description</label><br>
								<textarea id="editorDescription" th:field="*{description}"
									class="form-control" style="min-height: 140px;"></textarea>
							</div>
						</div>
					</section>

					<!-- Images & Videos Panel -->
					<section class="panel">
						<div class="panel-header" onclick="togglePanel(this)">Images
							and Videos</div>
						<div class="panel-body">
							<div class="upload-zone">
							<input type="file" name="image-file">
								<p>
									<strong>Browse files</strong> or drag & drop images here
								</p>
								<span class="field-note">Supports JPG, PNG, GIF files.</span>
							</div>
						</div>
						
						<div class="panel-body">
							<div class="form-group">
								<label for="url-key">Link Youtube Video</label> <input type="text"
									th:field="*{urlVideo}" class="form-control">
							</div>
						</div>
					</section>

					<!-- Product Attribute Optimization Panel -->
					<section class="panel">
						<div class="panel-header" onclick="togglePanel(this)">Product Attribute</div>
						<div class="panel-body">
							<div class="form-group">
								<label for="attribute-set">Attribute Set</label> <select
									id="attribute-set" class="form-control">
									<option value="default">Default</option>
									<option value="bag">Bag</option>
									<option value="gear">Gear</option>
								</select>
							</div>

							<div class="form-group">
								<label for="visibility">Visibility</label> <select
									id="visibility" class="form-control">
									<option value="4" selected>Catalog, Search</option>
									<option value="2">Catalog</option>
									<option value="3">Search</option>
									<option value="1">Not Visible Individually</option>
								</select>
							</div>
						</div>
					</section>

					<!-- Search Engine Optimization Panel -->
					<section class="panel">
						<div class="panel-header" onclick="togglePanel(this)">Search
							Engine Optimization</div>
						<div class="panel-body">
							<div class="form-group">
								<label for="url-key">URL Key</label> <input type="text"
									th:field="*{seoUrlKey}" class="form-control">
							</div>
							<div class="form-group">
								<label for="meta-title">Meta Title</label> <input type="text"
									th:field="*{seoMetaTitle}" class="form-control">
							</div>
							<div class="form-group">
								<label for="meta-keywords">Meta Keywords</label>
								<textarea th:field="*{seoMetaKeywords}" class="form-control"></textarea>
							</div>
							<div class="form-group">
								<label for="meta-desc">Meta Description</label>
								<textarea th:field="*{seoMetaDescription}" class="form-control"></textarea>
							</div>
						</div>
					</section>
				</main>
			</form>
			
			<div class="page-header" style="float: right;">
				<div class="action-buttons">
					<button class="btn-secondary">
						<a th:href="@{/backend/catalogs/product}">Back</a>
					</button>
					<button type="submit" form="add_product" name="action" value="save" class="btn-secondary">Save</button>
					<button type="submit" form="add_product" name="action" value="saveAndClose" class="btn-primary">Save & Closed</button>
				</div>
			</div>
		</main>
	</div>

	<script type="text/javascript">
		function togglePanel(header) {
			const panel = header.parentElement;
			panel.classList.toggle('collapsed');
		};
		
		ClassicEditor
        .create(document.querySelector('#editorShort'))
        .then(editor => {
        	editor.editing.view.change(writer => {
                writer.setStyle('height', '200px', editor.editing.view.document.getRoot());
                writer.setStyle('width', '900px', editor.editing.view.document.getRoot());
            });
        });
        
		ClassicEditor
        .create(document.querySelector('#editorDescription'))
        .then(editor => {
        	editor.editing.view.change(writer => {
                writer.setStyle('height', '300px', editor.editing.view.document.getRoot());
            });
        });
	</script>
</body>
</html>
