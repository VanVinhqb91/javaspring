<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{backend/fragments/head :: htmlHeadProduct}"></head>

<body class="text-slate-700 antialiased min-h-screen flex flex-col pb-0 pr-0">
    <div class="flex flex-1">
        <div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
        <main class="ml-[75px] flex-1 bg-[#f5f5f5] overflow-x-auto">
            <div class="p-6">
                <div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-light text-slate-800">
                            <b>Catalogs / Product / Update - ID: [[${id}]]</b>
                        </h1>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-secondary">
                            <a th:href="@{${urlSecretKey.url('/backend/catalogs/product')}}">Back</a>
                        </button>
                        <button type="submit" form="update_product" name="action" value="update"
                            class="btn-secondary">Update</button>
                        <button type="submit" form="update_product" name="action" value="updateAndClose"
                            class="btn-primary">Update & Closed</button>
                    </div>
                </div>

                <form id="update_product" th:action="@{${urlSecretKey.url('/backend/catalogs/product/update/' + id)}}"
                    th:object="${updateProduct}" enctype="multipart/form-data" method="POST"
                    class="bg-white border-slate-300 rounded-t shadow-sm">
                    <main class="main-content">
                        <section class="panel">
                            <div class="panel-header" onclick="togglePanel(this)">Basic
                                Settings</div>
                            <div class="panel-body">
                                <div class="form-group required">
                                    <label>Enable Product</label>
                                    <div class="switch-container">
                                        <label class="switch" style="width: 140px"> <input type="checkbox"
                                                name="status-product" value="1" th:checked="*{status == 1}">
                                            <span class="slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="form-group required">
                                    <label for="product-name">Product Name</label> <input type="text" th:field="*{name}"
                                        class="form-control" placeholder="e.g. Fusion Backpack" required>
                                </div>
                                <div class="form-group">
                                    <label for="slug">Slug</label> <input type="text" th:field="*{slug}"
                                        class="form-control">
                                </div>
                                <div class="form-group required">
                                    <label for="sku">SKU</label> <input type="text" th:field="*{sku}"
                                        class="form-control" placeholder="24-MB01" required>
                                </div>

                                <div class="form-group required">
                                    <label for="price">Price ($)</label> <input type="number" th:field="*{price}"
                                        class="form-control" required>
                                </div>

                                <div class="form-group">
                                    <label for="tax-class">Tax Class</label> <select id="tax-class"
                                        class="form-control">
                                        <option value="none">None</option>
                                        <option value="taxable" selected>Taxable Goods</option>
                                        <option value="shipping">Shipping</option>
                                    </select>
                                </div>

                                <div class="form-group required">
                                    <label for="qty">Quantity</label> <input type="number" th:field="*{qty}"
                                        class="form-control" value="100" required>
                                </div>

                                <div class="form-group">
                                    <label for="qty">Quantity Sold</label> <input type="number" th:field="*{qtySold}"
                                        class="form-control">
                                </div>

                                <div class="form-group required">
                                    <label for="stock-status">Stock Status</label> <select th:field="*{stockStatus}"
                                        class="form-control" required>
                                        <option value="1">In Stock</option>
                                        <option value="0">Out of Stock</option>
                                    </select>
                                </div>

                                <div class="form-group required">
                                    <label for="stock-status">Warranty Months</label> <select
                                        th:field="*{warrantyMonths}" class="form-control" required>
                                        <option value="0">Không Bảo Hành</option>
                                        <option value="6">Bảo Hành 6 Tháng</option>
                                        <option value="12">Bảo Hành 12 Tháng</option>
                                        <option value="18">Bảo Hành 18 Tháng</option>
                                        <option value="24">Bảo Hành 24 Tháng</option>
                                    </select>
                                </div>

                                <div class="form-group required">
                                    <label for="categories">Categories</label>
                                    <select th:field="*{categoryId}" class="form-control" multiple
                                        style="height: 180px;" required>
                                        <option th:each="cate:${flatCate}" th:value="${cate.id}" th:text="${cate.name}">
                                        </option>
                                    </select>
                                </div>
                                <div class="form-group required">
                                    <label for="categories">Brands</label>
                                    <select th:field="*{brandId}" class="form-control" multiple style="height: 180px;"
                                        required>
                                        <option th:each="brand:${brands}" th:value="${brand.id}">--- [[${brand.name}]]
                                            ([[${brand.slug}]])</option>
                                    </select>
                                </div>
                            </div>
                        </section>

                        <!-- Content Panel -->
                        <section class="panel">
                            <div class="panel-header" onclick="togglePanel(this)">Content</div>
                            <div class="panel-body">
                                <div class="form-group">
                                    <label for="short-desc">Short Description</label>
                                    <textarea id="editorShort" th:field="*{shortDescription}"
                                        class="form-control"></textarea>
                                </div>
                                <div class="form-group" style="display: block;">
                                    <label for="desc">Description</label><br>
                                    <textarea id="editorDescription" th:field="*{description}" class="form-control"
                                        style="min-height: 140px;"></textarea>
                                </div>
                            </div>
                        </section>

                        <!-- Images & Videos Panel -->
                        <section class="panel">
                            <div class="panel-header" onclick="togglePanel(this)">Images
                                and Videos</div>
                            <div class="panel-body">
                                <div class="upload-zone">
                                    <input type="file" name="image-file">
                                    <p>
                                        <strong>Browse files</strong> or drag & drop images here
                                    </p>
                                    <span class="field-note">Supports JPG, PNG, GIF files.</span>
                                </div>
                            </div>
                            <div class="panel-body">
                                <div class="form-group">
                                    <label for="url-key">Link Youtube Video</label> <input type="text"
                                        th:field="*{urlVideo}" class="form-control">
                                </div>
                            </div>
                        </section>

                        <!-- Product Attribute Optimization Panel -->
                        <section class="panel">
                            <div class="panel-header" onclick="togglePanel(this)">Product Attribute</div>
                            <div class="panel-body">
                                <div class="form-group">
                                    <label for="attribute-set">Attribute Set</label> <select id="attribute-set"
                                        class="form-control">
                                        <option value="default">Default</option>
                                        <option value="bag">Bag</option>
                                        <option value="gear">Gear</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="visibility">Visibility</label> <select id="visibility"
                                        class="form-control">
                                        <option value="4" selected>Catalog, Search</option>
                                        <option value="2">Catalog</option>
                                        <option value="3">Search</option>
                                        <option value="1">Not Visible Individually</option>
                                    </select>
                                </div>
                            </div>
                        </section>

                        <!-- Search Engine Optimization Panel -->
                        <section class="panel">
                            <div class="panel-header" onclick="togglePanel(this)">Search
                                Engine Optimization</div>
                            <div class="panel-body">
                                <div class="form-group">
                                    <label for="meta-title">Meta Title</label> <input type="text"
                                        th:field="*{seoMetaTitle}" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label for="meta-keywords">Meta Keywords</label>
                                    <textarea th:field="*{seoMetaKeywords}" class="form-control"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="meta-desc">Meta Description</label>
                                    <textarea th:field="*{seoMetaDescription}" class="form-control"></textarea>
                                </div>
                            </div>
                        </section>
                    </main>
                </form>
                <div class="w-[100%] pb-[60px]">
                    <div class="action-buttons float-right">
                        <button class="btn-secondary">
                            <a th:href="@{${urlSecretKey.url('/backend/catalogs/product')}}">Back</a>
                        </button>
                        <button type="submit" form="update_product" name="action" value="update"
                            class="btn-secondary">Update</button>
                        <button type="submit" form="update_product" name="action" value="updateAndClose"
                            class="btn-primary">Update & Closed</button>
                    </div>
                </div>
            </div>
            <div th:replace="~{backend/fragments/footer :: htmlFooter}"></div>
        </main>
    </div>
    
    <div id="mediaGalleryModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-2">
        <div class="bg-white shadow-xl w-full max-w-6xl h-[92vh] flex flex-col overflow-hidden">
            
            <!-- Header Modal -->
            <div class="px-6 py-4 border-b flex items-center justify-between bg-slate-50">
                <h3 class="text-lg font-semibold text-slate-800">Media Gallery</h3>
                <button type="button" onclick="closeMediaModal()" class="text-slate-500 hover:text-slate-800 text-2xl leading-none">&times;</button>
            </div>

            <!-- Thanh công cụ: Tìm kiếm & Nút chèn ảnh -->
            <div class="px-6 py-3 border-b flex items-center justify-between gap-4 bg-white">
                <div class="flex items-center gap-3">
                    <input type="text" id="modalSearchInput" onkeyup="renderModalGrid()" 
                           placeholder="Tìm kiếm tên ảnh..." 
                           class="border px-3 py-1.5 text-sm w-64">
                    
                    <!-- Nút upload nhanh ngay trong popup -->
                    <button type="button" onclick="document.getElementById('modalFileInput').click()"
                            class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-sm">
                        <i class="fas fa-upload mr-1"></i> Upload Image
                    </button>
                    <input type="file" id="modalFileInput" multiple accept="image/*" class="hidden" onchange="handleModalUpload(event)">
                </div>
                
                <div class="flex items-center gap-3">
                    <span class="text-sm text-slate-600">Đã chọn: <strong id="modalSelectedCount">0</strong> ảnh</span>
                    <button type="button" id="btnInsertSelected" disabled onclick="insertSelectedImagesToEditor()"
                            class="px-4 py-1.5 bg-orange-600 hover:bg-orange-700 disabled:bg-slate-300 text-white text-sm font-medium">
                        Insert Selected
                    </button>
                </div>
            </div>

            <!-- Lưới hiển thị ảnh từ /api/media -->
            <div id="modalMediaGrid" 
                 class="flex-1 overflow-y-auto p-6 grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-4 auto-rows-max content-start items-start bg-slate-50">
            </div>
        </div>
    </div>
    <script type="text/javascript" th:src="@{/js/admin_ckeditor_media.js}"></script>
</body>
</html>
