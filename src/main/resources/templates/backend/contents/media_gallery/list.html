<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{backend/fragments/head :: htmlHead}"></head>
<link rel="stylesheet" th:href="@{/css/admin_media_gallery.css}">

<body class="text-slate-700 antialiased min-h-screen flex flex-col pb-0 pr-0">
    <div class="flex flex-1">
        <div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
        <main class="ml-[75px] flex-1 bg-[#f5f5f5]">
            <div class="p-6">
                <div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-light text-slate-800">
                            <b>Contents / Media Gallery</b>
                        </h1>
                    </div>
                </div>
                <div class="bg-white border-slate-300">
                    <div class="items-center">
                        <div class="action-bar">
                            <button class="btn" onclick="createFolder()">Create Folder</button>
                            <button class="btn" onclick="document.getElementById('fileInput').click()">Upload Image</button>
                            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;" onchange="handleUpload(event)">
                            <button class="btn" id="btnDeleteFolder" onclick="deleteCurrentFolder()">Delete Folder</button>
                            <button class="btn" id="btnDeleteImages" disabled onclick="deleteSelectedImages()">Delete Images...</button>
                        </div>
                        
                        <div class="search-filter-row">
                            <div class="search-box">
                                <input type="text" id="searchInput" placeholder="Search by keyword" onkeyup="filterMedia()">
                                <i class="fas fa-search"></i>
                            </div>
                        </div>
                        
                        <div class="active-filters">
                            <div class="filter-tags">
                                <span>Active filters:</span>
                                <span class="tag-badge" id="activeFolderTag">
                                    Directory: <strong id="currentFolderName">media_gallery</strong>
                                    <i class="fas fa-times-circle" onclick="selectFolder('media_gallery', null)"></i>
                                </span>
                            </div>
                            <a class="clear-all" onclick="resetFilters()">Clear All</a>
                        </div>
                        
                        <div class="pagination-row">
                            <div class="records-info">
                                <div><strong id="recordCount">0</strong> records found</div>
                                <div class="sort-control">
                                    Sort by: 
                                    <select id="sortSelect" onchange="filterMedia()">
                                        <option value="newest">Newest first</option>
                                        <option value="oldest">Oldest first</option>
                                        <option value="name">Name (A - Z)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="pagination-controls">
                                <select class="page-size-select" id="pageSizeSelect">
                                    <option value="32">32</option>
                                    <option value="64">64</option>
                                    <option value="96">96</option>
                                </select>
                                <span>per page</span>
                                <button type="button" class="page-btn" id="prevPageBtn" disabled>
                                    <i class="fas fa-chevron-left"></i>
                                </button>

                                <input type="text" class="page-input" id="currentPageInput" value="1">
                                <span>of <span id="totalPagesText">1</span></span>

                                <button type="button" class="page-btn" id="nextPageBtn">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Khu vực làm việc chính: Cây thư mục trái + Lưới ảnh phải -->
                        <div class="gallery-workspace">
                            <aside class="folder-tree">
                                <ul class="tree-node">
                                    <li>
                                        <div class="tree-item" onclick="selectFolder('category', this)">
                                            <i class="fas fa-folder"></i> <span>Category</span>
                                        </div>
                                    </li>
                                    <li>
                                        <div class="tree-item active" id="defaultFolderItem" onclick="selectFolder('media_gallery', this)">
                                            <i class="fas fa-chevron-down" style="font-size: 10px;"></i>
                                            <i class="fas fa-folder"></i> <span>All Media Gallery</span>
                                        </div>
                                        <ul class="tree-node tree-children" id="subFolderList">
                                            <li th:each="folder : ${folders}">
                                                <div class="tree-item" 
                                                     th:data-id="${folder.id}"
                                                     th:data-slug="${folder.slug}" 
                                                     onclick="selectFolder(this.dataset.slug, this)">
                                                    <i class="fas fa-folder"></i> 
                                                    <span th:text="${folder.name}">Collection</span>
                                                </div>
                                            </li>
                                        </ul>
                                    </li>
                                </ul>
                            </aside>
                            <main class="media-grid" id="mediaGrid"></main>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{backend/fragments/footer :: htmlFooter}"></div>
        </main>
    </div>
    <script type="text/javascript" th:src="@{/js/admin_media_gallery.js}"></script>
</body>
</html>
