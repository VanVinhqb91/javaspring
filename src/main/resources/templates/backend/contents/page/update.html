<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{backend/fragments/head :: htmlHeadProduct}"></head>

<body class="text-slate-700 antialiased min-h-screen flex flex-col pb-0 pr-0">
	<div class="flex flex-1">
		<div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
		<main class="ml-[75px] flex-1 bg-[#f5f5f5] overflow-x-auto">
			<div class="p-6">
				<div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
				<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
					<div>
						<h1 class="text-2xl font-light text-slate-800">
							<b>Contents / Landing Page / Update</b>
						</h1>
					</div>
					<div class="action-buttons">
						<button class="btn-secondary">
							<a th:href="@{${urlSecretKey.url('/backend/contents/page')}}">Back</a>
						</button>
						<button class="btn-secondary">
							<a th:href="@{${urlSecretKey.url('/backend/contents/page/create')}}">Create</a>
						</button>
						<button type="submit" form="update_page" name="action" value="save"
							class="btn-secondary">Save</button>
						<button type="submit" form="update_page" name="action" value="saveAndClose"
							class="btn-primary">Save & Closed</button>
					</div>
				</div>

				<form id="update_page"
					th:action="@{${urlSecretKey.url('/backend/contents/page/update/' + pageObjects.id)}}"
					th:object="${pageObjects}" enctype="multipart/form-data" method="POST"
					class="bg-white border-slate-300 rounded-t shadow-sm">
					<main class="main-content">
						<section class="panel">
							<div class="panel-header" onclick="togglePanel(this)">Default Page</div>
							<div class="panel-body">
								<div class="form-group required">
									<label for="product-name">Page Key</label>
									<input type="text" th:field="*{pageKey}"
										style="width: 20%; background-color: #e3e3e3" class="form-control" readonly>
								</div>

								<div class="form-group required">
									<label>Page Status</label>
									<select th:field="*{status}" style="width: 20%;" class="form-control">
										<option value="Published">Published</option>
										<option value="Draft">Draft</option>
										<option value="Archived">Archived</option>
									</select>
								</div>

								<div class="form-group required">
									<label for="product-name">Page Name</label>
									<input type="text" th:field="*{pageName}" class="form-control" required>
								</div>

								<div class="form-group required">
									<label for="sku">Slug</label>
									<input type="text" th:field="*{slug}" class="form-control" required>
								</div>

								<div class="form-group required">
									<label for="price">Code HTML</label>
									<textarea id="editorCode" class="form-control" th:field="*{codeHtml}"
										style="min-height: 140px;"></textarea>
								</div>

							</div>
						</section>


						<!-- Search Engine Optimization Panel -->
						<section class="panel">
							<div class="panel-header" onclick="togglePanel(this)">Search
								Engine Optimization</div>
							<div class="panel-body">
								<div class="form-group">
									<label for="meta-title">Meta Title</label>
									<input type="text" th:field="*{title}" class="form-control">
								</div>
								<div class="form-group">
									<label for="meta-keywords">Meta Keywords</label>
									<textarea class="form-control"></textarea>
								</div>
								<div class="form-group">
									<label for="meta-desc">Meta Description</label>
									<textarea class="form-control"></textarea>
								</div>
							</div>
						</section>
					</main>
				</form>

				<div class="w-[100%] pb-[60px]">
					<div class="action-buttons" style="float: right;">
						<button class="btn-secondary">
							<a th:href="@{${urlSecretKey.url('/backend/contents/page')}}">Back</a>
						</button>
						<button type="submit" form="update_page" name="action" value="save"
							class="btn-secondary">Save</button>
						<button type="submit" form="update_page" name="action" value="saveAndClose"
							class="btn-primary">Save & Closed</button>
					</div>
				</div>
			</div>
			<div th:replace="~{backend/fragments/footer :: htmlFooter}"></div>
		</main>
	</div>

	<script type="text/javascript">
		function togglePanel(header) {
			const panel = header.parentElement;
			panel.classList.toggle('collapsed');
		};

		ClassicEditor
			.create(document.querySelector('#editorCode'))
			.then(editor => {
				editor.editing.view.change(writer => {
					writer.setStyle('height', '300px', editor.editing.view.document.getRoot());
					writer.setStyle('width', '900px', editor.editing.view.document.getRoot());
				});
			});
	</script>
</body>

</html>
