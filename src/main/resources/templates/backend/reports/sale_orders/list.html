<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{backend/fragments/head :: htmlHeadProduct}"></head>
<body class="text-slate-700 antialiased min-h-screen flex flex-col">
    <div class="flex flex-1">
        <div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
        <main class="ml-24 flex-1 bg-[#f5f5f5] p-6 overflow-x-auto">
            <div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-2xl font-light text-slate-800">
                    	<b>Reports / Sale Orders</b>
                    </h1>
                </div>
                <div class="flex items-center gap-3">
                    <button class="bg-[#e3e3e3] hover:bg-[#d5d5d5] text-slate-700 font-semibold text-xs px-4 py-2.5 shadow-sm border border-slate-300 transition flex items-center gap-2">
                        <i class="fa-solid fa-file-export"></i> Export CSV
                    </button>
                    <button class="bg-[#eb5202] hover:bg-[#ba4102] text-white font-semibold text-xs px-4 py-2.5 shadow-sm transition flex items-center gap-2">
                    	<a th:href="@{/backend/catalogs/product/create}">
                        	<span>Report Orders</span>
                       	</a>
                    </button>
                </div>
            </div>
            
            <div class="success-message" th:if="${successMessage}">
			    <span>[[${successMessage}]]</span>
			</div>
			<div class="error-message" th:if="${errorMessage}">
			    <span>[[${errorMessage}]]</span>
			</div>
			
            <div class="bg-white border border-slate-300 rounded-t shadow-sm">
                <div class="p-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs">
                    <div class="flex items-center gap-3 flex-wrap">
                        <div class="flex items-center">
                            <select class="bg-white border text-slate-700 rounded-l px-3 py-1.5 focus:outline-none focus:border-slate-400">
                                <option value="">Actions</option>
                                <option value="delete">Delete</option>
                                <option value="change_status">Change Status</option>
                                <option value="update_attributes">Update Attributes</option>
                            </select>
                            <button class="bg-[#f0f0f0] border border-l-0 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-r">
                                Submit
                            </button>
                        </div>
                        <span class="text-slate-400">|</span>
                        <div class="relative w-64">
                            <input type="text" placeholder="Search by keyword" class="w-full pl-3 pr-8 py-1.5 border rounded text-xs focus:outline-none focus:border-orange-500">
                            <i class="fa-solid fa-magnifying-glass absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        </div>
                        <!-- Active Filters Count -->
                        <button class="text-slate-600 hover:text-orange-600 flex items-center gap-1.5 font-semibold">
                            <i class="fa-solid fa-filter text-orange-500"></i> Filters
                        </button>
                    </div>
                    <!-- Right System Controls (Columns, Default View) -->
                    <div class="flex items-center gap-4 text-slate-600">
                        <button class="hover:text-slate-900 flex items-center gap-1" title="Default View">
                            <span>Default View</span>
                            <i class="fa-solid fa-caret-down text-[10px]"></i>
                        </button>
                        <button class="hover:text-slate-900 flex items-center gap-1" title="Columns Toggle">
                            <i class="fa-solid fa-table-columns"></i>
                            <span>Columns</span>
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    
                </div>

                <!-- Magento Pagination & Footer Bar -->
                <div class="p-3 border-t border-slate-200 bg-white flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-600">
                    <div class="flex items-center gap-2">
                        <span>12 records found</span>
                        <span class="text-slate-300">|</span>
                        <div class="flex items-center gap-1">
                            <span>Show</span>
                            <select id="sizeSelect" onchange="changePageSize()" class="border border-slate-300 rounded px-2 py-1 focus:outline-none">
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="30">30</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                            <span>per page</span>
                        </div>
                    </div>
					<div class="flex items-center justify-between gap-4 bg-white px-4 py-3 rounded-lg border border-slate-100 shadow-sm">
					    <!-- KHỐI BÊN TRÁI: THÔNG TIN TRANG (Tùy chọn hiển thị nếu cần) -->
					    <div class="text-sm text-slate-500">
					        Hiển thị trang <span class="font-medium text-slate-800">1</span> / <span class="font-medium text-slate-800" th:text="${totalPages}">10</span>
					    </div>
					</div>
                </div>
            </div>
        </main>
    </div>
<script th:inline="javascript">
	function changePageSize() {
	    // Lấy giá trị size vừa chọn từ thẻ select
	    const selectedSize = document.getElementById("sizeSelect").value;
	    
	    // Lấy các tham số hiện tại từ Thymeleaf (nếu chưa có thì lấy giá trị mặc định)
	    const sortBy = 'id';
	    const sortDir = 'asc';
	    
	    // Tạo URL mới và chuyển hướng trang (quay về trang đầu tiên là 0 khi đổi size)
	    window.location.href = '/backend/catalogs/product?page=0&size=' + selectedSize + '&sortBy=' + sortBy + '&sortDir=' + sortDir;
	}
</script>
</body>
</html>
