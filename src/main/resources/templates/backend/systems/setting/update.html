<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{backend/fragments/head :: htmlHeadUser}"></head>
<body class="text-slate-700 antialiased min-h-screen flex flex-col">
	<div class="flex flex-1">
		<div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
		<main class="ml-24 flex-1 bg-[#f5f5f5] p-6 overflow-x-auto">
		<div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
			<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
				<div>
					<h1 class="text-2xl font-light text-slate-800">
						<b>Systems / Setting / Update</b>
					</h1>
				</div>
				<div class="action-buttons">
					<button class="btn-secondary"><a th:href="@{/backend/systems/setting}">Back</a></button>
					<button type="submit" form="add_setting" class="btn-primary">Save Setting</button>
				</div>
			</div>
			<form id="add_setting" th:action="@{/backend/systems/setting/update/{key}(key=${key})}" th:object="${formCreateSetting}" method="POST" class="admin-content">
				<div id="user-info" class="tab-pane active">
					<h2 class="fieldset-title">Update Setting</h2>

					<div class="form-group required">
						<label for="username">Setting Key</label>
						<div class="form-control-wrapper">
							<input type="text" th:field="*{settingKey}" style="background-color: #e2e2e2" class="form-control" readonly="readonly"/>
						</div>
					</div>

					<div class="form-group required">
						<label for="email">Setting Value</label>
						<div class="form-control-wrapper">
							<input type="text" th:field="*{settingValue}" class="form-control" required/>
						</div>
					</div>
				</div>
			</form>
		</main>
	</div>
</body>
</html>
