<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{backend/fragments/head :: htmlHeadProduct}"></head>

<body class="text-slate-700 antialiased min-h-screen flex flex-col pb-0 pr-0">
    <div class="flex flex-1">
        <div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
        <main class="ml-[75px] flex-1 bg-[#f5f5f5] overflow-x-auto">
            <div class="p-6">
                <div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-light text-slate-800">
                            <b>Systems / Cronjob Schedule</b>
                        </h1>
                    </div>
                    <div class="flex items-center gap-3">
                        <button
                            class="bg-[#eb5202] hover:bg-[#ba4102] text-white font-semibold text-xs px-4 py-2.5 shadow-sm transition flex items-center gap-2">
                            <a th:href="@{${urlSecretKey.url('/backend/systems/cronjob/create')}}">
                                <span>Create New Cronjob</span>
                            </a>
                        </button>
                    </div>
                </div>

                <div class="success-message" th:if="${successMessage}">
                    <span>[[${successMessage}]]</span>
                </div>
                <div class="error-message" th:if="${errorMessage}">
                    <span>[[${errorMessage}]]</span>
                </div>

                <div class="bg-white border-slate-300 rounded-t">
                    <div class="overflow-x-auto">
                        <div class="grid-wrapper">
                            <table class="m2-grid-table">
                                <thead class="h-[50px]">
                                    <tr>
                                        <th class="sortable" style="width: 60px;">ID <i
                                                class="fa-solid fa-arrow-up"></i></th>
                                        <th>Cronjob Name</th>
                                        <th>Cronjob Key</th>
                                        <th style="width: 180px;">Cronjob Value</th>
                                        <th style="width: 200px;">Created At</th>
                                        <th>Status</th>
                                        <th style="width: 100px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cronjob : ${cronjobs}" class="data-row">
                                        <td th:text="${cronjob.id}">1</td>
                                        <td th:text="${cronjob.name}">Name</td>
                                        <td th:text="${cronjob.cronKey}">Key</td>
                                        <td th:text="${cronjob.cronValue}">Value</td>
                                        <td th:text="${cronjob.createdAt}">Jun 10, 2026, 7:57:49 PM</td>
                                        <td th:if="${cronjob.status == true}" class="text-green-600">Activated</td>
                                        <td th:unless="${cronjob.status == true}" class="text-red-600">Deactivated</td>
                                        <td>
                                            <a th:href="@{${urlSecretKey.url('/backend/systems/cronjob/update/' + cronjob.id)}}"
                                                class="action-link">Update</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div
                        class="p-3 bg-white flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-600">
                        <div class="flex items-center gap-2">
                            <span>12 records found</span>
                            <span class="text-slate-300">|</span>
                            <div class="flex items-center gap-1">
                                <span>Show</span>
                                <select id="sizeSelect" onchange="changePageSize()"
                                    class="border border-slate-300 rounded px-2 py-1 focus:outline-none">
                                    <option value="10">10</option>
                                    <option value="20">20</option>
                                    <option value="30">30</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                                <span>per page</span>
                            </div>
                        </div>
                        <div
                            class="flex items-center justify-between gap-4 bg-white px-4 py-3 rounded-lg border border-slate-100 shadow-sm">
                            <div class="text-sm text-slate-500">
                                Hiển thị trang <span class="font-medium text-slate-800">1</span> / <span
                                    class="font-medium text-slate-800" th:text="${totalPages}">10</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{backend/fragments/footer :: htmlFooter}"></div>
        </main>
    </div>
</body>
</html>
