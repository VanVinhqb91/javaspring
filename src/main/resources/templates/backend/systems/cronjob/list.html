<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{backend/fragments/head :: htmlHeadUser}"></head>
<body class="text-slate-700 antialiased min-h-screen flex flex-col">
	<div class="flex flex-1">
		<div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
		<main class="ml-24 flex-1 bg-[#f5f5f5] p-6 overflow-x-auto">
			<div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
			<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
				<div>
					<h1 class="text-2xl font-light text-slate-800">
						<b>Systems / CronJob</b>
					</h1>
				</div>
				<div class="action-buttons">
					<button class="btn-secondary"><a th:href="@{/backend/systems/cronjob}">Back</a></button>
					<button type="submit" form="update_cronjob" class="btn-primary">Save Setting</button>
				</div>
			</div>
			<form id="update_cronjob" th:action="@{/backend/systems/cronjob/update}" method="POST" class="admin-content">
				<div th:each="cronjob:${cronjobs}" id="user-info" class="tab-pane active">
					<h2 th:text="${#strings.toUpperCase(cronjob.settingKey)}" class="fieldset-title">Update Setting CronJob</h2>

					<div class="form-group required">
						<label class="cronname">CronJob Name</label>
						<div class="form-control-wrapper">
							<input type="text" th:name="${cronjob.settingKey}" th:value="${cronjob.settingKey}" style="background-color: #e2e2e2" class="form-control" readonly="readonly"/>
						</div>
					</div>

					<div class="form-group required">
						<label class="crontime">Setting CronJob Run Time</label>
						<div class="form-control-wrapper">
							<select th:name="${cronjob.settingKey + '_select'}" th:value="${cronjob.settingValue}" class="form-control" required>
								<option value="0 0 0 * * ?" th:selected="${cronjob.settingValue == '0 0 0 * * ?'}">Chạy Lúc 12h Đêm Mỗi Ngày</option>
								<option value="0 0 6 * * ?" th:selected="${cronjob.settingValue == '0 0 6 * * ?'}">Chạy Lúc 6h Sáng mỗi Ngày</option>
								<option value="0 0 10 * * ?" th:selected="${cronjob.settingValue == '0 0 10 * * ?'}">Chạy Lúc 10h Sáng mỗi Ngày</option>
							</select>
						</div>
					</div>
				</div>
			</form>
		</main>
	</div>
</body>
</html>
