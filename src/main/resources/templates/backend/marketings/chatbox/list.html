<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{backend/fragments/head :: htmlHead}"></th:block>
	<link rel="stylesheet" th:href="@{/css/adminchatbox.css}">
	<script th:src="@{/js/sockjs.min.js}"></script>
</head>

<body class="text-slate-700 antialiased min-h-screen flex flex-col">
    
    <div class="flex flex-1">
        <div th:replace="~{backend/fragments/leftsidebar :: htmlLeftSideBar}"></div>
        <main class="ml-24 flex-1 bg-[#f5f5f5] p-6 overflow-x-auto">
            <div th:replace="~{backend/fragments/header :: htmlHeader}"></div>
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-2xl font-light text-slate-800">
                    	<b>Marketings / Rabbit MQ ChatBox</b>
                    </h1>
                </div>
            </div>

            <div class="bg-white border border-slate-300 rounded-t shadow-sm">
				<!-- CỘT TRÁI: DANH SÁCH KHÁCH TRỰC TUYẾN -->
				<div class="sidebar">
				    <div class="sidebar-header">Khách Đang Đợi (<span id="countActive">0</span>)</div>
				    <ul class="customer-list" id="customerList">
				        <!-- Danh sách khách vãng lai sẽ được tự động thêm vào bằng JS -->
				    </ul>
				</div>

				<!-- KHUNG PHẢI: MÀN HÌNH HỘI THOẠI CHI TIẾT -->
				<div class="chat-area">
				    <div class="chat-header" id="activeChatHeader">Vui lòng chọn một khách hàng để bắt đầu hỗ trợ</div>
				    
				    <div class="chat-messages" id="chatMessages">
				        <div class="message system">Chưa có cuộc hội thoại nào được chọn.</div>
				    </div>

				    <div class="chat-footer">
				        <input type="text" id="adminInput" placeholder="Nhập câu trả lời hỗ trợ..." disabled />
				        <button id="sendBtn" onclick="sendAdminReply()" disabled>Trả lời</button>
				    </div>
				</div>
            </div>
        </main>
    </div>
	<script th:src="@{/js/adminchatbox.js}"></script>
</body>
</html>
